<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tic-tac-toe</title>
    <link rel="stylesheet" href="/src/styles.css">
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">Two players · One device</p>
      <h1>Tic-tac-toe</h1>
      <p class="intro">Take turns. Make a line of three.</p>
      <p id="status" role="status" aria-atomic="true">X’s turn</p>
      <div id="board" role="group" aria-label="Tic-tac-toe board"></div>
      <button id="restart" type="button">New game</button>
      <p class="hint">X goes first. Choose a square to play.</p>
      <noscript>Please enable JavaScript to play.</noscript>
    </main>
  </body>
</html>
